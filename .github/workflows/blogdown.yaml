# Render the blogdown site and deploy it to the master branch (GitHub Pages)
# Source of truth: branch "source" — the deployed site lives on "master".
name: deployblog

on:
  push:
    branches:
      - source
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deployblog:
    name: Render and deploy blogdown
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Required so the knitr "python" chunks (why-not-both post) can run
      RETICULATE_PYTHON: /usr/bin/python3
    steps:
      # Clone the repository (including the PaperMod theme submodule)
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Set up an R installation to run our scripts
      - uses: r-lib/actions/setup-r@v2

      # Pandoc is needed to compile the R Markdown posts
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        # blogdown: site builder; reticulate: runs the python chunks;
        # dplyr/tidyr/stringr/kableExtra: used by executed chunks in the posts.
        # RSPM (ubuntu-24.04/noble) provides prebuilt binaries, so this step
        # takes ~1 minute instead of compiling everything from source.
        run: Rscript -e 'options(repos = c(CRAN = "https://packagemanager.rstudio.com/cran/__linux__/noble/latest"), pkgType = "binary"); install.packages(c("blogdown", "reticulate", "dplyr", "tidyr", "stringr", "kableExtra"))'

      - name: Install Hugo
        # Version matches options(blogdown.hugo.version) in .Rprofile
        run: Rscript -e 'blogdown::install_hugo(extended = TRUE, version = "0.165.0")'

      - name: Render blog
        # build_rmd = TRUE is required so the .Rmd posts are knitted to HTML
        run: Rscript -e 'blogdown::build_site(local = FALSE, build_rmd = TRUE)'

      - name: Clean build artifacts from public/
        # Remove the .Rmd/.RDS source files that Hugo copies verbatim to public/
        run: |
          find ./public -name "*.Rmd" -delete
          find ./public -name "*.RDS" -delete

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./public
