# =============================================================
# Site configuration — Hugo PaperMod + blogdown
# Docs: https://github.com/adityatelange/hugo-PaperMod/wiki
# =============================================================

baseURL = "https://adsoncostanzifilho.github.io/"
title = "Adson Costanzi Filho"
theme = "PaperMod"

# Language: English is the default (served at the site root, without prefix).
# Portuguese and Spanish are served under /pt/ and /es/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = true
paginate = 5
summaryLength = 70
publishDir = "public"

# Home page outputs: HTML, RSS and JSON (JSON is used by the search feature)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

# blogdown's HTML method stores posts as .html content files, which newer Hugo
# versions deny by default. Whitelist the content types this site uses.
[security]
  allowContent = ["text/html", "text/markdown", "text/plain"]

# ------------------------------------------------------------------
# Global parameters (shared by every language)
# ------------------------------------------------------------------
[params]
  env = "production"
  defaultTheme = "auto"
  disableThemeToggle = false
  displayFullLangName = true
  mainSections = ["blog"]
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true
  ShowToc = true

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon.ico"
    favicon32x32 = "favicon.ico"
    apple_touch_icon = "apple-touch-icon.png"

  [params.cover]
    linkFullImages = true

  # Client-side search (Fuse.js)
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/adsoncostanzifilho"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/adsoncostanzifilho/"

# ------------------------------------------------------------------
# English — default language, served at the site root
# ------------------------------------------------------------------
[languages.en]
  locale = "en"
  label = "English"
  weight = 1
  contentDir = "content/en"
  title = "Adson Costanzi Filho"

  [languages.en.params]
    description = "Personal blog about statistics, data science and R by Adson Costanzi Filho."

    [languages.en.params.homeInfoParams]
      title = "Adson Costanzi Filho"
      Content = """
Hi! Welcome to my blog about **statistics**, **data science** and **R**.
Here I share my ideas, tutorials and projects. Feel free to get in touch!
"""

  [[languages.en.menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 1
  [[languages.en.menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 2
  [[languages.en.menu.main]]
    name = "Résumé"
    url = "/files/cv.pdf"
    weight = 3
  [[languages.en.menu.main]]
    name = "Search"
    pageRef = "/search"
    weight = 4

